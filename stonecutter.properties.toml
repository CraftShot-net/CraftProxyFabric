[mod]
id = "craftproxy"
name = "CraftProxy"
group = "net.craftproxy.mod"
version = "1.2.2"
channel_tag = ""
description = "Host your Minecraft World to the public. Only the Host needs the Mod!"
authors = ["Timeox2k"]
contributors = []
inception_year = "2025"
license.name = "CC0-1.0"
license.url = "https://creativecommons.org/publicdomain/zero/1.0/"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/craftshot-net/CraftProxyFabric"
homepage_url = "https://craftproxy.net"
issues_url = "https://github.com/craftshot-net/CraftProxyFabric/issues"
discord_url = "https://discord.gg/wBj5Jf9pcm"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]
entrypoints.main = ["net.craftproxy.mod.CraftProxy"]
entrypoints.client = ["net.craftproxy.mod.client.MCTunnelClient"]

[[mod.pom.developers]]
id = "timeox2k"
name = "Timeox2k"
url = "https://github.com/Timeox2k"

[fabric]
deps.fabric-loader = "0.19.5"
deps.devauth = "1.2.2"

# `deps.minecraft` is the version the project is compiled against,
# `deps.minecraft_range` (optional) is what fabric.mod.json accepts.

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.fabric-api = "0.92.12+1.20.1"

[fabric."1.21.1"]
deps.minecraft = "1.21.1"
deps.minecraft_range = ">=1.21 <=1.21.1"
deps.fabric-api = "0.116.17+1.21.1"
publish.additionalVersions = ["1.21"]

[fabric."1.21.11"]
deps.minecraft = "1.21.11"
deps.fabric-api = "0.141.6+1.21.11"

[fabric."26.1.2"]
deps.minecraft = "26.1.2"
deps.minecraft_range = ">=26.1 <=26.1.2"
deps.fabric-api = "0.155.3+26.1.2"
publish.additionalVersions = ["26.1.1", "26.1"]

[fabric."26.2"]
deps.minecraft = "26.2"
deps.fabric-api = "0.161.0+26.2"

[fabric."26.3"]
deps.minecraft = "26.3"
deps.fabric-api = "0.165.0+26.3"
